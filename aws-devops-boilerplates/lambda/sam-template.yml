AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: app.lambda_handler
      Runtime: python3.9
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /hello
            Method: GET
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          API_KEY: '{{API_KEY}}'  # Replace with your API key or set at runtime
